[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardsegments"
version = "0.1.0"
description = "Segmenting the graded-card market: block-pruned features, k selected honestly, stability-tested clusters, and a leak-audited supervised validation - with pre-registered predictions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chase Baker", email = "chasebak@usc.edu" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "scikit-learn>=1.8",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
